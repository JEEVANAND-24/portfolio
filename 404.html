<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // SPA redirect for GitHub Pages
      var path = window.location.pathname;
      var repo = path.split('/')[1] || '';
      // Redirect to index with hash
      window.location.replace(window.location.origin + '/' + repo + '/#/' + path.split('/').slice(2).join('/'));
    </script>
  </head>
  <body>
    Redirecting to portfolio...
  </body>
</html>
