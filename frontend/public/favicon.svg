<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Deep dark navy background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#11202f"/>
    </linearGradient>
    <!-- AWS orange gradient for cloud -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>
    <!-- Soft glow filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="13" ry="13" fill="url(#bgGrad)"/>

  <!-- Subtle inner border ring -->
  <rect x="1" y="1" width="62" height="62" rx="12" ry="12"
        fill="none" stroke="#FF9900" stroke-width="0.8" stroke-opacity="0.2"/>

  <!-- ── AWS-style Cloud shape ── -->
  <!-- Main cloud body: built from circles + rect -->
  <g filter="url(#softGlow)">
    <!-- Left cloud bump -->
    <circle cx="22" cy="34" r="8" fill="url(#cloudGrad)"/>
    <!-- Center-left bump -->
    <circle cx="29" cy="30" r="9.5" fill="url(#cloudGrad)"/>
    <!-- Center-right bump (tallest) -->
    <circle cx="37" cy="28" r="10" fill="url(#cloudGrad)"/>
    <!-- Right bump -->
    <circle cx="46" cy="32" r="7.5" fill="url(#cloudGrad)"/>
    <!-- Bottom fill bar (cloud base) -->
    <rect x="14" y="32" width="39" height="10" rx="0" fill="url(#cloudGrad)"/>
    <!-- Clean flat bottom -->
    <rect x="14" y="38" width="39" height="4" rx="2" fill="url(#cloudGrad)"/>
  </g>

  <!-- ── Upload arrow inside cloud ── -->
  <!-- Arrow shaft -->
  <rect x="30" y="26" width="4" height="13" rx="1.5" fill="#0d1b2a"/>
  <!-- Arrow head -->
  <polygon points="32,18 25,28 39,28" fill="#0d1b2a"/>

  <!-- Bottom label: tiny "AWS" text -->
  <text
    x="32"
    y="58"
    font-family="'Arial', 'Helvetica', sans-serif"
    font-size="7"
    font-weight="800"
    text-anchor="middle"
    letter-spacing="1.5"
    fill="#FF9900"
    opacity="0.85"
  >AWS</text>
</svg>